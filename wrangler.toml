# Cloudflare Workers: ανέβασμα του στατικού site (HTML/CSS/JS) χωρίς build.
name = "nepsis-site"
compatibility_date = "2024-11-01"
# Required by `npx wrangler preview` (PR / non-production branch builds).
# Empty is fine when Previews need no separate bindings/vars.
previews = { }

[assets]
# Τα αρχεία του site βρίσκονται στον κεντρικό φάκελο του repo.
directory = "."
# Η σελίδα 404.html εμφανίζεται για διευθύνσεις που δεν υπάρχουν.
not_found_handling = "404-page"
