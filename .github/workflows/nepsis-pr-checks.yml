name: Nepsis pull request checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/nepsis-full-preview]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(git ls-files -z '*.js')

      - name: Run progress synchronization regression tests
        run: node --test scripts/progress-sync-regression.test.mjs
