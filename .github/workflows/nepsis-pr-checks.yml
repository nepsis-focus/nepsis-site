name: Nepsis pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nepsis-pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(git ls-files -z '*.js')

      - name: Check Node.js script syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/*.mjs; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Run progress synchronization regression tests
        run: node --test scripts/progress-sync-regression.test.mjs

  browser-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve the site
        run: python3 -m http.server 4173 >/tmp/nepsis-preview.log 2>&1 &

      - name: Test this pull request in a browser
        env:
          SITE_URL: http://127.0.0.1:4173
        run: node scripts/site-watchdog.mjs
